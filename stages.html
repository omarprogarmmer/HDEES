<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <!-- ⚡ 1) تطبيق الإعدادات فوراً (الوضع الداكن + حجم الخط) -->
    <script src="stting_mc.js"></script>
<script src="reminders.js"></script>

    <!-- 🎨 2) المتغيرات العامة -->
    <link rel="stylesheet" href="m_c.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#2e7d32">

    <style>
        /* ============================================================
           🔤 إعدادات عامة — إعادة تعيين الهوامش والخطوط
           ============================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        /* ============================================================
           🎨 المتغيرات الجذرية
           ============================================================ */
        :root {
            --bg-page: #f0e8d8;
            --frame-color: #2e7d32;
            --frame-height: 52px;
            --frame-text: #ffffff;
            --exit-text: #cccccc;

            --stage-bg: #0d47a1;
            --stage-completed-bg: #1565c0;
            --stage-current-bg: #0d47a1;
            --stage-locked-opacity: 0.35;

            --line-color: #000000;
            --dot-size: 7px;
            --dot-gap: 34px;
            --radius: 62px;
            --gap-y: 96px;
            --swing: 78px;
            --divider-thickness: 8px;
            --lift: -60px;

            --container-padding: 16px;
        }

        /* ============================================================
           📄 إعدادات الصفحة الأساسية
           ============================================================ */
        html {
            overflow-x: hidden;
        }

        html, body {
            height: 100%;
        }

        body {
            min-height: 100vh;
            background: var(--bg-page);
            padding-bottom: 100px;
            overflow-x: hidden;
            width: 100%;
            max-width: 100%;
            touch-action: pan-y;
            position: relative;
        }

        /* ============================================================
           🌈 الخلفية المتحركة
           ============================================================ */
        .animated-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
            background: linear-gradient(135deg, #f0e8d8 0%, #e8dcc8 50%, #f0e8d8 100%);
            background-size: 400% 400%;
            animation: gradientShift 14s ease infinite;
        }

        @keyframes gradientShift {
            0%   { background-position: 0% 50%; }
            50%  { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .animated-bg .bubble {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%,
                        rgba(46, 125, 50, 0.15),
                        rgba(46, 125, 50, 0.05));
            border: 1px solid rgba(46, 125, 50, 0.1);
            animation: floatUp linear infinite;
            will-change: transform;
        }

        @keyframes floatUp {
            0%   { transform: translateY(100vh) scale(0.6) rotate(0deg); opacity: 0; }
            10%  { opacity: 1; }
            90%  { opacity: 0.8; }
            100% { transform: translateY(-20vh) scale(1.15) rotate(180deg); opacity: 0; }
        }

        .animated-bg .shape {
            position: absolute;
            border: 2px solid rgba(13, 71, 161, 0.06);
            animation: rotateShape linear infinite;
            will-change: transform;
        }

        @keyframes rotateShape {
            from { transform: rotate(0deg); }
            to   { transform: rotate(360deg); }
        }

        .animated-bg .pulse-circle {
            position: absolute;
            border-radius: 50%;
            border: 2px solid rgba(46, 125, 50, 0.08);
            animation: pulseRing 6s ease-out infinite;
            will-change: transform, opacity;
        }

        @keyframes pulseRing {
            0%   { transform: scale(0.5); opacity: 0.6; }
            100% { transform: scale(2);   opacity: 0; }
        }

        /* ============================================================
           🔝 الشريط العلوي
           ============================================================ */
        .top-frame {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: calc(var(--frame-height) + env(safe-area-inset-top, 0px));
            padding-top: env(safe-area-inset-top, 0px);
            background: var(--frame-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-left: 14px;
            padding-right: 14px;
            z-index: 999;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.2);
        }

        .page-title {
            font-size: 15px;
            font-weight: 700;
            color: var(--frame-text);
        }

        .exit-btn {
            width: 36px;
            height: 36px;
            background: transparent;
            color: var(--exit-text);
            border: 2px solid var(--exit-text);
            border-radius: 50%;
            font-size: 20px;
            font-weight: 900;
            line-height: 1;
            cursor: pointer;
            transition: 0.25s;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
        }

        .exit-btn:active {
            color: #fff;
            border-color: #fff;
            background: rgba(255, 255, 255, 0.15);
            transform: scale(0.92);
        }

        /* ============================================================
           🔻 الشريط السفلي
           ============================================================ */
        .bottom-frame {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: calc(var(--frame-height) + env(safe-area-inset-bottom, 0px));
            padding-bottom: env(safe-area-inset-bottom, 0px);
            background: var(--frame-color);
            z-index: 999;
            box-shadow: 0 -3px 12px rgba(0, 0, 0, 0.2);
        }

        /* ============================================================
           🗺️ حاوية الخريطة
           ============================================================ */
        .map-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
            padding: var(--frame-height) var(--container-padding) 40px;
        }

        /* ============================================================
           ⚫ طبقة النقاط
           ============================================================ */
        .dots-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
            overflow: visible;
        }

        .dot {
            position: absolute;
            width: var(--dot-size);
            height: var(--dot-size);
            background: var(--line-color);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            opacity: 0.9;
            will-change: transform;
        }

        /* ============================================================
           🎠 حاوية المراحل
           ============================================================ */
        .stages-wrapper {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column-reverse;
            gap: var(--gap-y);
            align-items: center;
            transform: translateY(var(--lift));
        }

        .stage-row {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            transform: translateX(var(--row-offset, 0px));
        }

        /* ============================================================
           ⭕ دائرة المرحلة
           ============================================================ */
        .stage-circle {
            width: var(--radius);
            height: var(--radius);
            border-radius: 50%;
            background: var(--stage-bg);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            font-weight: 800;
            color: #fff;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s, opacity 0.2s;
            user-select: none;
            -webkit-user-select: none;
            position: relative;
            box-shadow: 0 6px 14px rgba(0, 0, 0, 0.3);
            border: 4px solid rgba(255, 255, 255, 0.18);
            z-index: 3;
        }

        .stage-circle:active {
            transform: scale(0.94);
        }

        .stage-circle.completed {
            background: var(--stage-completed-bg);
            color: #e3f2fd;
        }

        .stage-circle.current {
            background: var(--stage-current-bg);
            color: #e0e0e0;
            box-shadow: 0 0 0 5px rgba(13, 71, 161, 0.18),
                        0 6px 14px rgba(0, 0, 0, 0.3);
            animation: pulse 2s ease-in-out infinite;
        }

        .stage-circle.current .stage-num {
            display: none;
        }

        .stage-circle.current::after {
            content: "★";
            font-size: 30px;
            font-weight: 400;
            color: #ffd54f;
            line-height: 1;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
        }

        .stage-circle.locked {
            opacity: var(--stage-locked-opacity);
            cursor: not-allowed;
            filter: grayscale(50%);
        }

        .stage-circle.locked:active {
            transform: none;
        }

        @keyframes pulse {
            0%, 100% {
                box-shadow: 0 0 0 5px rgba(13, 71, 161, 0.18),
                            0 6px 14px rgba(0, 0, 0, 0.3);
            }
            50% {
                box-shadow: 0 0 0 12px rgba(13, 71, 161, 0.05),
                            0 6px 14px rgba(0, 0, 0, 0.3);
            }
        }

        .stage-num {
            color: inherit;
            pointer-events: none;
            font-family: 'Segoe UI', Tahoma, sans-serif;
        }

        /* ============================================================
           💬 فقاعة اسم المرحلة
           ============================================================ */
        .stage-popup {
            position: absolute;
            right: calc(100% + 10px);
            top: 50%;
            transform: translateY(-50%) scale(0.6);
            background: var(--stage-bg);
            color: #fff;
            padding: 5px 12px;
            border-radius: 18px;
            font-size: 12px;
            font-weight: 800;
            opacity: 0;
            pointer-events: none;
            transition: 0.3s ease;
            white-space: nowrap;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.25);
            z-index: 10;
        }

        .stage-popup.show {
            opacity: 1;
            transform: translateY(-50%) scale(1);
        }

        .stage-popup::before {
            content: "";
            position: absolute;
            left: 100%;
            top: 50%;
            transform: translateY(-50%);
            border: 6px solid transparent;
            border-left-color: var(--stage-bg);
        }

        /* ============================================================
           ➖ الفاصل الأفقي — متوافق مع جميع الأجهزة
           العرض يُحسب بـ JavaScript ليطابق الشاشة الفعلية بدقة
           ============================================================ */

        /* الحاوية: مرساة للموضع العمودي فقط */
        .thick-divider-wrap {
            position: relative;
            width: 100%;
            height: var(--divider-thickness);
            overflow: visible;
            pointer-events: none;
        }

        /* الفاصل: يتمدد من منتصف الخريطة إلى طرفي نافذة العرض */
        .thick-divider {
            position: absolute;
            top: 0;
            left: calc(50% - 50vw);
            width: 100vw;

            height: var(--divider-thickness);
            background: var(--line-color);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
            pointer-events: none;
        }

        /* ============================================================
           📱 استجابة الشاشات الصغيرة
           ============================================================ */
        @media (max-width: 380px) {
            :root {
                --radius: 54px;
                --gap-y: 86px;
                --swing: 62px;
                --dot-size: 6px;
                --dot-gap: 30px;
                --divider-thickness: 6px;
                --lift: -50px;
            }
            .stage-circle { font-size: 20px; }
            .stage-circle.current::after { font-size: 26px; }
            .stage-popup { font-size: 11px; padding: 4px 10px; }
            .page-title { font-size: 14px; }
        }

        @media (max-width: 340px) {
            :root {
                --radius: 48px;
                --gap-y: 78px;
                --swing: 52px;
                --dot-size: 5px;
                --dot-gap: 26px;
                --divider-thickness: 5px;
                --lift: -40px;
            }
            .stage-circle { font-size: 18px; border-width: 3px; }
            .stage-circle.current::after { font-size: 22px; }
        }

        /* ============================================================
           ♿ احترام تفضيل تقليل الحركة
           ============================================================ */
        @media (prefers-reduced-motion: reduce) {
            .animated-bg,
            .animated-bg .bubble,
            .animated-bg .shape,
            .animated-bg .pulse-circle,
            .stage-circle.current {
                animation: none !important;
            }
        }
    </style>
</head>
<body>

<!-- 🌈 الخلفية المتحركة -->
<div class="animated-bg" id="animatedBg"></div>

<!-- 🔊 صوت الأزرار -->
<audio id="clickSound" src="sound/buttem.mp3" preload="auto"></audio>

<!-- 🔝 الشريط العلوي -->
<div class="top-frame">
    <div class="page-title">🗺️ المراحل</div>
    <button class="exit-btn" id="exitBtn" aria-label="خروج">&gt;</button>
</div>

<!-- 🗺️ حاوية الخريطة -->
<div class="map-container" id="mapContainer">
    <div class="dots-layer" id="dotsLayer"></div>
    <div class="stages-wrapper" id="stagesWrapper"></div>
</div>

<!-- 🔻 الشريط السفلي -->
<div class="bottom-frame"></div>

<script>
/* ============================================================
   🔊 نظام صوت الأزرار
   ============================================================ */
(function () {
    "use strict";

    let clickSound = null;
    let initialized = false;

    function initButtonSound() {
        if (initialized) return;
        clickSound = document.getElementById('clickSound');
        if (!clickSound) {
            console.warn('⚠️ عنصر clickSound غير موجود');
            return;
        }

        document.addEventListener('click', function (e) {
            const target = e.target.closest('button, .stage-circle');
            if (!target) return;
            playClickSound();
        }, true);

        initialized = true;
    }

    function playClickSound() {
        if (!clickSound) return;
        try {
            clickSound.pause();
            clickSound.currentTime = 0;
            const promise = clickSound.play();
            if (promise && promise.catch) {
                promise.catch(function (err) {
                    console.warn('تعذر تشغيل صوت الزر:', err);
                });
            }
        } catch (err) {
            console.warn('خطأ في تشغيل الصوت:', err);
        }
    }

    if (document.readyState === 'complete') {
        initButtonSound();
    } else {
        window.addEventListener('load', initButtonSound);
    }
})();

/* ============================================================
   🎨 إنشاء الخلفية المتحركة
   ============================================================ */
function createAnimatedBackground() {
    const bg = document.getElementById("animatedBg");
    if (!bg) return;

    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduceMotion) return;

    for (let i = 0; i < 15; i++) {
        const bubble = document.createElement("div");
        bubble.className = "bubble";
        const size = 30 + Math.random() * 100;
        const duration = 14 + Math.random() * 20;
        bubble.style.width = size + "px";
        bubble.style.height = size + "px";
        bubble.style.left = Math.random() * 100 + "%";
        bubble.style.animationDuration = duration + "s";
        bubble.style.animationDelay = -(Math.random() * duration) + "s";
        bg.appendChild(bubble);
    }

    for (let i = 0; i < 6; i++) {
        const shape = document.createElement("div");
        shape.className = "shape";
        const size = 50 + Math.random() * 90;
        const duration = 25 + Math.random() * 30;
        shape.style.width = size + "px";
        shape.style.height = size + "px";
        shape.style.left = (5 + Math.random() * 90) + "%";
        shape.style.top = (5 + Math.random() * 90) + "%";
        shape.style.borderRadius = Math.random() > 0.5 ? "50%" : "12%";
        shape.style.animationDuration = duration + "s";
        shape.style.animationDelay = -(Math.random() * duration) + "s";
        bg.appendChild(shape);
    }

    for (let i = 0; i < 5; i++) {
        const pulse = document.createElement("div");
        pulse.className = "pulse-circle";
        const size = 40 + Math.random() * 60;
        const duration = 5 + Math.random() * 4;
        pulse.style.width = size + "px";
        pulse.style.height = size + "px";
        pulse.style.left = (10 + Math.random() * 80) + "%";
        pulse.style.top = (10 + Math.random() * 80) + "%";
        pulse.style.animationDuration = duration + "s";
        pulse.style.animationDelay = -(Math.random() * duration) + "s";
        bg.appendChild(pulse);
    }
}

/* ============================================================
   ⚙️ الإعدادات
   ============================================================ */
const CONFIG = {
    totalStages: 20,
    dividerEvery: 4,

    themeKey: "app_theme",
    fontSizeKey: "app_font_size",
    lessonsKey: "lessons_stages_count",
    exercisesKey: "exercises_stages_count",

    exitUrl: "index.html",
    exitConfirmMessage: "هل تريد الخروج؟",

    stageLinks: {
        1:  "g1_level1.html",
        2:  "g1_t1.html",
        3:  "g1_t2.html",
        4:  "g1_t3.html",
        5:  "g2_level1.html",
        6:  "g2_t1.html",
        7:  "g2_t2.html",
        8:  "g2_t3.html",
        9:  "g3_level1.html",
        10: "g3_t1.html",
        11: "g3_t2.html",
        12: "g3_t3.html",
        13: "g4_level1.html",
        14: "g4_t1.html",
        15: "g4_t2.html",
        16: "g4_t3.html",
        17: "g5_level1.html",
        18: "g5_t1.html",
        19: "g5_t2.html",
        20: "g5_t3.html",
    },
};

/* ============================================================
   🔙 زر الخروج
   ============================================================ */
(function initExitButton() {
    const exitBtn = document.getElementById("exitBtn");
    if (!exitBtn) return;
    exitBtn.addEventListener("click", function () {
        window.location.href = CONFIG.exitUrl;
    });
})();

/* ============================================================
   📊 عدد المراحل المكتملة
   ============================================================ */
function getCompletedCount() {
    const lessons = parseInt(localStorage.getItem(CONFIG.lessonsKey) || "0", 10);
    const exercises = parseInt(localStorage.getItem(CONFIG.exercisesKey) || "0", 10);
    const safeLessons = isNaN(lessons) ? 0 : Math.max(0, lessons);
    const safeExercises = isNaN(exercises) ? 0 : Math.max(0, exercises);
    return safeLessons + safeExercises;
}

/* ============================================================
   🎯 حالة المرحلة
   ============================================================ */
function getStageState(index) {
    const completed = getCompletedCount();
    if (index <= completed) return "completed";
    if (index === completed + 1) return "current";
    return "locked";
}

/* ============================================================
   🎠 الانزياح الأفقي
   ============================================================ */
function getRowOffset(index) {
    const swing = parseFloat(
        getComputedStyle(document.documentElement).getPropertyValue('--swing')
    ) || 78;
    const phase = (index - 1) * (Math.PI / 2);
    return Math.sin(phase) * swing;
}

/* ============================================================
   🏗️ بناء المراحل
   ============================================================ */
const stagesWrapper = document.getElementById("stagesWrapper");

function buildStages() {
    if (!stagesWrapper) return;
    stagesWrapper.innerHTML = "";

    for (let i = 1; i <= CONFIG.totalStages; i++) {
        const state = getStageState(i);

        const circle = document.createElement("div");
        circle.className = "stage-circle " + state;
        circle.dataset.index = i;
        circle.setAttribute("role", "button");
        circle.setAttribute("aria-label", "المرحلة " + i);
        circle.setAttribute("tabindex", "0");

        const num = document.createElement("span");
        num.className = "stage-num";
        num.textContent = i;
        circle.appendChild(num);

        const popup = document.createElement("div");
        popup.className = "stage-popup";
        popup.textContent = "المرحلة " + i;

        const row = document.createElement("div");
        row.className = "stage-row";
        row.style.setProperty("--row-offset", getRowOffset(i) + "px");
        row.appendChild(circle);
        row.appendChild(popup);
        stagesWrapper.appendChild(row);

        circle.addEventListener("click", function (e) {
            e.stopPropagation();
            handleStageClick(i, state, popup);
        });

        circle.addEventListener("keydown", function (e) {
            if (e.key === "Enter" || e.key === " ") {
                e.preventDefault();
                handleStageClick(i, state, popup);
            }
        });

        if (i % CONFIG.dividerEvery === 0 && i < CONFIG.totalStages) {
            const dividerWrap = document.createElement("div");
            dividerWrap.className = "thick-divider-wrap";
            const divider = document.createElement("div");
            divider.className = "thick-divider";
            dividerWrap.appendChild(divider);
            stagesWrapper.appendChild(dividerWrap);
        }
    }

    requestAnimationFrame(function () {
        requestAnimationFrame(function () {
            drawDots();
        });
    });
}

/* ============================================================
   🖱️ معالج الضغط على مرحلة
   ============================================================ */
function handleStageClick(index, state, popup) {
    if (popup) {
        popup.classList.add("show");
        clearTimeout(popup._timer);
        popup._timer = setTimeout(function () {
            popup.classList.remove("show");
        }, 1800);
    }

    if (state === "locked") {
        setTimeout(function () {
            alert("🔒 هذه المرحلة مقفلة");
        }, 200);
        return;
    }

    const link = CONFIG.stageLinks[index];
    if (link) {
        setTimeout(function () {
            window.location.href = link;
        }, 450);
    } else {
        setTimeout(function () {
            alert("⚠️ لا توجد صفحة للمرحلة " + index);
        }, 200);
    }
}

/* ============================================================
   🔵 رسم النقاط بين المراحل
   ============================================================ */
function drawDots() {
    const dotsLayer = document.getElementById("dotsLayer");
    const container = document.getElementById("mapContainer");
    const circles = Array.from(document.querySelectorAll(".stage-circle"));

    if (!dotsLayer || !container || circles.length === 0) return;

    dotsLayer.innerHTML = "";
    const containerRect = container.getBoundingClientRect();

    const points = circles.map(function (circle, idx) {
        const rect = circle.getBoundingClientRect();
        return {
            x: rect.left - containerRect.left + rect.width / 2,
            y: rect.top - containerRect.top + rect.height / 2,
            index: idx + 1,
        };
    });

    points.sort(function (a, b) { return b.y - a.y; });

    const gap = parseFloat(
        getComputedStyle(document.documentElement).getPropertyValue('--dot-gap')
    ) || 34;

    for (let i = 0; i < points.length - 1; i++) {
        const p1 = points[i];
        const p2 = points[i + 1];
        const dx = p2.x - p1.x;
        const dy = p2.y - p1.y;
        const dist = Math.hypot(dx, dy);
        const count = Math.max(1, Math.round(dist / gap));

        for (let d = 1; d < count; d++) {
            const t = d / count;
            const midY = (p1.y + p2.y) / 2;
            const x = cubicBezier(p1.x, p1.x, p2.x, p2.x, t);
            const y = cubicBezier(p1.y, midY, midY, p2.y, t);

            const dot = document.createElement("div");
            dot.className = "dot";
            dot.style.left = x + "px";
            dot.style.top = y + "px";
            dotsLayer.appendChild(dot);
        }
    }
}

function cubicBezier(p0, p1, p2, p3, t) {
    const mt = 1 - t;
    return mt * mt * mt * p0 +
           3 * mt * mt * t * p1 +
           3 * mt * t * t * p2 +
           t * t * t * p3;
}

/* ============================================================
   🎯 التمرير للمرحلة الحالية
   ============================================================ */
function scrollToCurrentStage() {
    const currentCircle = document.querySelector(".stage-circle.current");

    if (!currentCircle) {
        window.scrollTo({ top: 0, behavior: "smooth" });
        return;
    }

    const rect = currentCircle.getBoundingClientRect();
    const scrollTop = window.pageYOffset || document.documentElement.scrollTop;
    const targetY = rect.top + scrollTop - (window.innerHeight / 2) + (rect.height / 2);

    window.scrollTo({ top: Math.max(0, targetY), behavior: "smooth" });
}

/* ============================================================
   🚀 التشغيل
   ============================================================ */
createAnimatedBackground();
buildStages();

// التمرير للمرحلة الحالية بعد اكتمال الرسم
setTimeout(scrollToCurrentStage, 500);

/* ============================================================
   🔄 إعادة الرسم عند تغيير الحجم أو الاتجاه
   ============================================================ */
let resizeTimer;
window.addEventListener("resize", function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function () {
        drawDots();
    }, 200);
});

window.addEventListener("orientationchange", function () {
    setTimeout(function () {
        drawDots();
    }, 300);
});

/* ============================================================
   📡 الاستماع لحدث اكتمال مرحلة
   ============================================================ */
window.addEventListener("stageCompleted", function (e) {
    console.log("🎯 اكتملت المرحلة:", e.detail);
    buildStages();
    setTimeout(scrollToCurrentStage, 300);
});
</script>
