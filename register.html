<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<script src="stting_mc.js"></script>
<script src="reminders.js"></script>
<link rel="stylesheet" href="m_c.css">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>حديث — البدء</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2e7d32">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="حديث">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }

  /* ============================================================
     🎨 ألوان خضراء ودرجاتها
     ============================================================ */
  :root {
    --green-deep:   #0f3d1e;  /* أخضر عميق جداً */
    --green-dark:   #1b5e20;  /* أخضر داكن */
    --green-mid:    #2e7d32;  /* أخضر متوسط */
    --green-main:   #43a047;  /* أخضر أساسي */
    --green-light:  #66bb6a;  /* أخضر فاتح */
    --green-lime:   #8bc34a;  /* أخضر ليموني */
    --green-soft:   #a5d6a7;  /* أخضر ناعم */
    --green-pale:   #c8e6c9;  /* أخضر شاحب */
  }

  body {
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, #0f3d1e 0%, #1b5e20 35%, #43a047 65%, #0f3d1e 100%);
    background-size: 300% 300%;
    animation: bgShift 18s ease infinite;
    padding: 20px;
    position: relative;
    overflow-x: hidden;
  }

  @keyframes bgShift {
    0%, 100% { background-position: 0% 50%; }
    50%      { background-position: 100% 50%; }
  }

  /* ☁️ طبقة الغيوم */
  .clouds-layer {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    overflow: hidden;
  }

  .cloud {
    position: absolute;
    background: rgba(255, 255, 255, 0.16);
    border-radius: 100px;
    filter: blur(8px);
    will-change: transform;
    animation: cloudDrift linear infinite;
  }

  .cloud::before,
  .cloud::after {
    content: "";
    position: absolute;
    background: inherit;
    border-radius: 50%;
  }
  .cloud::before {
    width: 55%; height: 140%;
    top: -60%; left: 15%;
  }
  .cloud::after {
    width: 45%; height: 120%;
    top: -40%; right: 15%;
  }

  @keyframes cloudDrift {
    0%   { transform: translateX(110vw) translateY(0) scale(1); }
    100% { transform: translateX(-30vw) translateY(-10px) scale(1.05); }
  }

  /* ✨ هالات متوهجة */
  .card-effects {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    overflow: hidden;
  }

  .glow-orb {
    position: absolute;
    top: 50%; left: 50%;
    width: 520px; height: 520px;
    margin: -260px 0 0 -260px;
    border-radius: 50%;
    background: radial-gradient(circle,
      rgba(102, 187, 106, 0.42) 0%,
      rgba(139, 195, 74, 0.15) 40%,
      transparent 70%);
    filter: blur(60px);
    animation: orbFloat 14s ease-in-out infinite,
               orbPulse 7s ease-in-out infinite;
  }
  .glow-orb.orb-2 {
    width: 360px; height: 360px;
    margin: -180px 0 0 -180px;
    background: radial-gradient(circle,
      rgba(139, 195, 74, 0.32) 0%,
      rgba(67, 160, 71, 0.1) 45%,
      transparent 70%);
    animation: orbFloat2 17s ease-in-out infinite,
               orbPulse 9s ease-in-out infinite reverse;
  }
  @keyframes orbFloat {
    0%, 100% { transform: translate(-40px, -30px) scale(1); }
    50%      { transform: translate(50px, 40px) scale(1.12); }
  }
  @keyframes orbFloat2 {
    0%, 100% { transform: translate(50px, 30px) scale(1); }
    50%      { transform: translate(-60px, -40px) scale(1.18); }
  }
  @keyframes orbPulse {
    0%, 100% { opacity: 0.6; }
    50%      { opacity: 1; }
  }

  /* 🃏 البطاقة */
  .card {
    position: relative;
    z-index: 1;
    background: rgba(15, 45, 22, 0.78);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(102, 187, 106, 0.35);
    border-radius: 20px;
    padding: 32px 24px 28px;
    width: 100%; max-width: 440px;
    box-shadow:
      0 20px 60px rgba(0, 0, 0, 0.5),
      0 0 40px rgba(102, 187, 106, 0.18),
      inset 0 1px 0 rgba(255, 255, 255, 0.1);
    animation: fadeIn 0.5s ease,
               cardGlow 5s ease-in-out infinite;
    overflow: hidden;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes cardGlow {
    0%, 100% {
      box-shadow:
        0 20px 60px rgba(0, 0, 0, 0.5),
        0 0 40px rgba(102, 187, 106, 0.18),
        inset 0 1px 0 rgba(255, 255, 255, 0.1);
    }
    50% {
      box-shadow:
        0 24px 70px rgba(0, 0, 0, 0.6),
        0 0 80px rgba(102, 187, 106, 0.4),
        0 0 120px rgba(139, 195, 74, 0.2),
        inset 0 1px 0 rgba(255, 255, 255, 0.15);
    }
  }

  /* 🧭 نظام الخطوات */
  .step { display: none; }
  .step.active { display: block; animation: stepIn 0.4s ease; }
  @keyframes stepIn {
    from { opacity: 0; transform: translateX(-14px); }
    to   { opacity: 1; transform: translateX(0); }
  }

  .steps-indicator {
    display: flex; justify-content: center; gap: 8px;
    margin-bottom: 22px;
  }
  .steps-indicator .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: rgba(200, 230, 201, 0.25); transition: 0.3s;
  }
  .steps-indicator .dot.active {
    background: linear-gradient(135deg, #66bb6a, #8bc34a);
    width: 26px; border-radius: 4px;
    box-shadow: 0 0 12px rgba(102, 187, 106, 0.7);
  }

  h1 {
    font-size: 22px;
    background: linear-gradient(135deg, #66bb6a, #8bc34a, #c8e6c9);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    text-align: center;
    margin-bottom: 22px;
    font-weight: 800;
  }

  label {
    display: block; font-size: 13px; font-weight: 700;
    color: rgba(200, 230, 201, 0.9); margin-bottom: 6px;
  }

  input {
    width: 100%; padding: 12px 14px; margin-bottom: 14px;
    border: 1.5px solid rgba(102, 187, 106, 0.3);
    border-radius: 10px;
    font-size: 15px; outline: none; transition: 0.25s;
    background: rgba(255, 255, 255, 0.05);
    color: #e8ffe8;
  }
  input::placeholder { color: rgba(200, 230, 201, 0.4); }
  input:focus {
    border-color: rgba(102, 187, 106, 0.8);
    background: rgba(102, 187, 106, 0.1);
    box-shadow: 0 0 0 3px rgba(102, 187, 106, 0.2);
  }

  .error {
    color: #ff8080; font-size: 12px; font-weight: 600;
    margin-top: -8px; margin-bottom: 12px; min-height: 16px;
  }

  button.primary {
    width: 100%; padding: 14px; border: none; border-radius: 12px;
    background: linear-gradient(135deg, #43a047, #8bc34a);
    color: #fff; font-size: 15px; font-weight: 800;
    cursor: pointer; transition: 0.3s;
    box-shadow: 0 8px 24px rgba(67, 160, 71, 0.45);
    position: relative;
    overflow: hidden;
  }
  button.primary::after {
    content: "";
    position: absolute;
    top: 0; left: -100%;
    width: 100%; height: 100%;
    background: linear-gradient(90deg,
      transparent, rgba(255,255,255,0.35), transparent);
    transition: 0.6s;
  }
  button.primary:hover::after { left: 100%; }
  button.primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 32px rgba(67, 160, 71, 0.6);
  }

  .install-icon {
    width: 96px; height: 96px;
    border-radius: 24px;
    margin: 0 auto 18px;
    background: linear-gradient(135deg, #43a047, #8bc34a);
    display: flex; align-items: center; justify-content: center;
    font-size: 46px; color: #fff;
    box-shadow: 0 10px 30px rgba(67, 160, 71, 0.5);
    animation: iconFloat 3s ease-in-out infinite;
  }
  @keyframes iconFloat {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-6px); }
  }

  .install-subtitle {
    font-size: 14px; color: rgba(200, 230, 201, 0.75);
    line-height: 1.7; margin-bottom: 22px; text-align: center;
  }

  /* 📱 أزرار اختيار الجهاز */
  .device-choices {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-bottom: 8px;
  }

  .device-btn {
    display: flex;
    align-items: center;
    gap: 14px;
    width: 100%;
    padding: 16px 18px;
    border: 1.5px solid rgba(102, 187, 106, 0.3);
    border-radius: 14px;
    background: rgba(102, 187, 106, 0.08);
    color: #e8ffe8;
    font-size: 15px;
    font-weight: 800;
    font-family: inherit;
    cursor: pointer;
    transition: 0.25s;
    text-align: right;
  }
  .device-btn:hover,
  .device-btn:focus {
    background: rgba(102, 187, 106, 0.18);
    border-color: rgba(102, 187, 106, 0.7);
    transform: translateY(-2px);
    box-shadow: 0 8px 22px rgba(67, 160, 71, 0.3);
  }
  .device-btn .device-icon {
    font-size: 28px;
    line-height: 1;
  }
  .device-btn .device-label {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .device-btn .device-name { font-weight: 800; font-size: 15px; }
  .device-btn .device-hint {
    font-weight: 600;
    font-size: 12px;
    color: rgba(200, 230, 201, 0.65);
  }
  .device-btn .device-arrow {
    font-size: 18px;
    color: rgba(200, 230, 201, 0.5);
  }

  /* 📖 صفحة شرح التثبيت */
  .guide-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 16px;
  }

  .back-btn {
    flex-shrink: 0;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: 1.5px solid rgba(102, 187, 106, 0.35);
    background: rgba(102, 187, 106, 0.08);
    color: #e8ffe8;
    font-size: 16px;
    cursor: pointer;
    transition: 0.25s;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .back-btn:hover {
    background: rgba(102, 187, 106, 0.2);
    border-color: rgba(102, 187, 106, 0.75);
  }

  .guide-title {
    flex: 1;
    font-size: 18px;
    font-weight: 800;
    background: linear-gradient(135deg, #66bb6a, #8bc34a);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    text-align: right;
  }

  .guide-icon-big {
    width: 88px;
    height: 88px;
    border-radius: 22px;
    margin: 0 auto 16px;
    background: linear-gradient(135deg, #43a047, #8bc34a);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 42px;
    color: #fff;
    box-shadow: 0 10px 30px rgba(67, 160, 71, 0.5);
    animation: iconFloat 3s ease-in-out infinite;
  }

  .guide-desc {
    font-size: 13px;
    color: rgba(200, 230, 201, 0.75);
    line-height: 1.7;
    text-align: center;
    margin-bottom: 20px;
  }

  .steps-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-bottom: 20px;
  }

  .step-item {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 12px 14px;
    background: rgba(102, 187, 106, 0.08);
    border: 1px solid rgba(102, 187, 106, 0.2);
    border-radius: 12px;
  }

  .step-item .step-num {
    flex-shrink: 0;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    background: linear-gradient(135deg, #43a047, #8bc34a);
    color: #fff;
    font-size: 12px;
    font-weight: 800;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 3px 8px rgba(67, 160, 71, 0.35);
  }

  .step-item .step-text {
    flex: 1;
    font-size: 13.5px;
    color: rgba(200, 230, 201, 0.9);
    line-height: 1.6;
  }
  .step-item .step-text strong {
    color: #a5d6a7;
    font-weight: 800;
  }

  .skip-btn {
    display: block; width: 100%; margin-top: 8px;
    padding: 14px; background: linear-gradient(135deg, #43a047, #8bc34a);
    border: none;
    border-radius: 12px;
    color: #fff; font-size: 15px; font-weight: 800;
    cursor: pointer; transition: 0.25s;
    box-shadow: 0 8px 24px rgba(67, 160, 71, 0.45);
  }
  .skip-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 32px rgba(67, 160, 71, 0.6);
  }

  .hint {
    margin-top: 14px; font-size: 12px;
    color: rgba(200, 230, 201, 0.75);
    line-height: 1.7; padding: 12px;
    background: rgba(102, 187, 106, 0.1);
    border-radius: 10px; text-align: right;
    border-right: 3px solid #66bb6a;
  }

  @media (max-width: 480px) {
    .glow-orb { width: 360px; height: 360px; margin: -180px 0 0 -180px; filter: blur(50px); }
    .glow-orb.orb-2 { width: 260px; height: 260px; margin: -130px 0 0 -130px; }
    .card { padding: 28px 20px 24px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .glow-orb, .card, .install-icon, .guide-icon-big, .cloud {
      animation: none !important;
    }
  }
</style>
</head>
<body>

<audio id="clickSound" src="sound/buttem.mp3" preload="auto"></audio>

<div class="clouds-layer" id="cloudsLayer" aria-hidden="true"></div>

<div class="card-effects" aria-hidden="true">
  <div class="glow-orb"></div>
  <div class="glow-orb orb-2"></div>
</div>

<div class="card">

  <div class="steps-indicator">
    <div class="dot active" id="dot1"></div>
    <div class="dot" id="dot2"></div>
    <div class="dot" id="dot3"></div>
  </div>

  <!-- الخطوة 1 — التسجيل -->
  <div class="step active" id="step1">
    <h1>👋 مرحباً بك في|حديث|</h1>

    <label for="username">اسم المستخدم</label>
    <input type="text" id="username" placeholder="اكتب اسمك" maxlength="20">

    <label for="age">العمر</label>
    <input type="number" id="age" placeholder="مثال: 12" min="5" max="99">

    <div class="error" id="errorMsg"></div>

    <button class="primary" id="nextBtn">متابعة ←</button>
  </div>

  <!-- الخطوة 2 — اختيار الجهاز -->
  <div class="step" id="step2">
    <div class="install-icon">💬</div>

    <h1 style="margin-bottom:10px;">ثبّت تطبيق حديث</h1>
    <p class="install-subtitle">
      اختر جهازك لنعرض لك خطوات التثبيت المناسبة له.
    </p>

    <div class="device-choices">
      <button class="device-btn" data-device="android">
        <span class="device-icon">📱</span>
        <span class="device-label">
          <span class="device-name">أندرويد</span>
          <span class="device-hint">Chrome · Edge · Samsung</span>
        </span>
        <span class="device-arrow">←</span>
      </button>

      <button class="device-btn" data-device="ios">
        <span class="device-icon">🍎</span>
        <span class="device-label">
          <span class="device-name">آيفون / آيباد</span>
          <span class="device-hint">Safari</span>
        </span>
        <span class="device-arrow">←</span>
      </button>

      <button class="device-btn" data-device="desktop">
        <span class="device-icon">💻</span>
        <span class="device-label">
          <span class="device-name">كمبيوتر</span>
          <span class="device-hint">Chrome · Edge</span>
        </span>
        <span class="device-arrow">←</span>
      </button>
    </div>

  </div>

  <!-- الخطوة 3 — شرح التثبيت -->
  <div class="step" id="step3">
    <div class="guide-header">
      <button class="back-btn" id="backBtn" title="رجوع">→</button>
      <div class="guide-title" id="guideTitle">—</div>
    </div>

    <div class="guide-icon-big" id="guideIcon">📱</div>

    <p class="guide-desc" id="guideDesc">—</p>

    <div class="steps-list" id="stepsList"></div>

    <button class="skip-btn" id="skipBtn">تخطي الآن ←</button>

    <div class="hint" id="hintBox" style="display:none;"></div>
  </div>

</div>

<script>
/* ============================================================
   ☁️ توليد الغيوم
   ============================================================ */
function createClouds() {
  const layer = document.getElementById('cloudsLayer');
  if (!layer) return;

  for (let i = 0; i < 8; i++) {
    const cloud = document.createElement('div');
    cloud.className = 'cloud';

    const width = 120 + Math.random() * 180;
    const height = width * (0.35 + Math.random() * 0.15);
    const topPos = Math.random() * 90;
    const duration = 40 + Math.random() * 50;
    const opacity = 0.12 + Math.random() * 0.18;

    cloud.style.width = width + 'px';
    cloud.style.height = height + 'px';
    cloud.style.top = topPos + '%';
    cloud.style.background = `rgba(255, 255, 255, ${opacity})`;
    cloud.style.filter = `blur(${6 + Math.random() * 6}px)`;
    cloud.style.animationDuration = duration + 's';
    cloud.style.animationDelay = -(Math.random() * duration) + 's';

    layer.appendChild(cloud);
  }
}

/* ============================================================
   🔊 صوت الأزرار
   ============================================================ */
(function () {
  function initButtonSound() {
    const clickSound = document.getElementById('clickSound');
    if (!clickSound) return;

    document.addEventListener('click', function (e) {
      const btn = e.target.closest('button');
      if (!btn) return;
      if (btn.disabled) return;

      try {
        clickSound.pause();
        clickSound.currentTime = 0;
        const p = clickSound.play();
        if (p && p.catch) p.catch(() => {});
      } catch (err) {}
    }, true);
  }

  if (document.readyState === 'complete') {
    initButtonSound();
  } else {
    window.addEventListener('load', initButtonSound);
  }
})();

/* ============================================================
   🚀 تسجيل Service Worker
   ============================================================ */
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("service-worker.js")
      .then(() => console.log("✅ SW مسجل — تطبيق حديث"))
      .catch(err => console.warn("⚠️ SW:", err));
  });
}

/* ============================================================
   🧭 نظام الخطوات
   ============================================================ */
const step1El = document.getElementById("step1");
const step2El = document.getElementById("step2");
const step3El = document.getElementById("step3");
const dot1    = document.getElementById("dot1");
const dot2    = document.getElementById("dot2");
const dot3    = document.getElementById("dot3");
const steps   = [step1El, step2El, step3El];
const dots    = [dot1, dot2, dot3];

function goToStep(index) {
  steps.forEach((s, i) => s.classList.toggle("active", i === index));
  dots.forEach((d, i) => d.classList.toggle("active", i === index));
  window.scrollTo({ top: 0, behavior: "smooth" });
}

/* ============================================================
   📝 الخطوة 1 — التسجيل
   ============================================================ */
document.getElementById("nextBtn").onclick = () => {
  const username = document.getElementById("username").value.trim();
  const age      = document.getElementById("age").value.trim();
  const errorEl  = document.getElementById("errorMsg");

  errorEl.textContent = "";

  if (!username) {
    errorEl.textContent = "❌ اكتب اسم المستخدم";
    return;
  }
  if (username.length < 2) {
    errorEl.textContent = "❌ الاسم قصير جداً (حرفان على الأقل)";
    return;
  }
  if (!age || isNaN(age) || age < 5 || age > 99) {
    errorEl.textContent = "❌ العمر غير صحيح (بين 5 و 99)";
    return;
  }

  localStorage.setItem("player_name", username);
  localStorage.setItem("player_age", age);

  goToStep(1);
};

document.getElementById("username").addEventListener("keydown", (e) => {
  if (e.key === "Enter") document.getElementById("age").focus();
});
document.getElementById("age").addEventListener("keydown", (e) => {
  if (e.key === "Enter") document.getElementById("nextBtn").click();
});

/* ============================================================
   📱 بيانات شرح التثبيت لكل جهاز
   ============================================================ */
const GUIDES = {
  android: {
    icon: "📱",
    title: "أندرويد",
    desc: "اتبع هذه الخطوات على متصفح Chrome أو Edge أو Samsung Internet على هاتفك.",
    steps: [
      "اضغط على زر <strong>القائمة (⋮)</strong> في أعلى الشاشة.",
      'اختر <strong>"إضافة إلى الشاشة الرئيسية"</strong>.',
      'اضغط <strong>"تثبيت"</strong> في النافذة المنبثقة.',
      "ستجد أيقونة <strong>حديث</strong> على شاشتك الرئيسية جاهزة للفتح!"
    ]
  },
  ios: {
    icon: "🍎",
    title: "آيفون / آيباد",
    desc: "التثبيت على آيفون يتم عبر متصفح Safari فقط (وليس Chrome).",
    steps: [
      "افتح التطبيق في متصفح <strong>Safari</strong>.",
      "اضغط زر <strong>المشاركة ⎋</strong> في أسفل الشاشة (مربع بسهم للأعلى).",
      'مرّر للأسفل واختر <strong>"إضافة إلى الشاشة الرئيسية"</strong>.',
      'اكتب اسمًا (مثلًا: حديث) ثم اضغط <strong>"إضافة"</strong>.',
      "ستجد الأيقونة على شاشتك الرئيسية جاهزة!"
    ]
  },
  desktop: {
    icon: "💻",
    title: "كمبيوتر",
    desc: "على الكمبيوتر، يثبت التطبيق نفسه في نافذة مستقلة داخل Chrome أو Edge.",
    steps: [
      "في الأعلى ثلاث نقاط اضغط عليها.",
      'سيفتح لك قائمة ابحث عن <strong>(البث والمشاركة والحفظ)</strong>.',
      "سيفتح لك قائمة اضغط <strong>إنشاء اختصار</strong>."
    ]
  }
};

/* ============================================================
   🖱️ اختيار الجهاز → عرض الشرح
   ============================================================ */
document.querySelectorAll(".device-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    const device = btn.dataset.device;
    showGuide(device);
  });
});

function showGuide(deviceKey) {
  const guide = GUIDES[deviceKey];
  if (!guide) return;

  document.getElementById("guideTitle").textContent = guide.title;
  document.getElementById("guideIcon").textContent  = guide.icon;
  document.getElementById("guideDesc").textContent  = guide.desc;

  const list = document.getElementById("stepsList");
  list.innerHTML = "";
  guide.steps.forEach((text, i) => {
    const item = document.createElement("div");
    item.className = "step-item";
    item.innerHTML = `
      <div class="step-num">${i + 1}</div>
      <div class="step-text">${text}</div>
    `;
    list.appendChild(item);
  });

  localStorage.setItem("install_device", deviceKey);

  goToStep(2);
}

/* ============================================================
   🔙 زر الرجوع من الشرح → اختيار الجهاز
   ============================================================ */
document.getElementById("backBtn").onclick = () => {
  goToStep(1);
};

/* ============================================================
   ⏭️ زر التخطي → الانتقال للصفحة التالية
   ============================================================ */
document.getElementById("skipBtn").onclick = () => {
  window.location.href = "index.html";
};

/* ============================================================
   🚀 التشغيل
   ============================================================ */
createClouds();
</script>
