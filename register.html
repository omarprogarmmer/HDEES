<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>حديث — البدء</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a0e27">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="حديث">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }

  /* ============================================================
     🌌 خلفية احترافية داكنة
     ============================================================ */
  body {
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 50%, #0f1428 100%);
    background-size: 300% 300%;
    animation: bgShift 18s ease infinite;
    padding: 20px;
    position: relative;
    overflow-x: hidden;
  }

  @keyframes bgShift {
    0%, 100% { background-position: 0% 50%; }
    50%      { background-position: 100% 50%; }
  }

  /* ============================================================
     🌟 تأثيرات خلف البطاقة
     ============================================================ */
  .card-effects {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    overflow: hidden;
  }

  /* 1️⃣ هالة متوهجة زرقاء سماوية */
  .glow-orb {
    position: absolute;
    top: 50%; left: 50%;
    width: 520px; height: 520px;
    margin: -260px 0 0 -260px;
    border-radius: 50%;
    background: radial-gradient(circle,
      rgba(64, 156, 255, 0.35) 0%,
      rgba(64, 156, 255, 0.12) 40%,
      transparent 70%);
    filter: blur(60px);
    animation: orbFloat 14s ease-in-out infinite,
               orbPulse 7s ease-in-out infinite;
  }

  .glow-orb.orb-2 {
    width: 360px; height: 360px;
    margin: -180px 0 0 -180px;
    background: radial-gradient(circle,
      rgba(138, 43, 226, 0.28) 0%,
      rgba(138, 43, 226, 0.08) 45%,
      transparent 70%);
    animation: orbFloat2 17s ease-in-out infinite,
               orbPulse 9s ease-in-out infinite reverse;
  }

  @keyframes orbFloat {
    0%, 100% { transform: translate(-40px, -30px) scale(1); }
    50%      { transform: translate(50px, 40px) scale(1.12); }
  }
  @keyframes orbFloat2 {
    0%, 100% { transform: translate(50px, 30px) scale(1); }
    50%      { transform: translate(-60px, -40px) scale(1.18); }
  }
  @keyframes orbPulse {
    0%, 100% { opacity: 0.55; }
    50%      { opacity: 1; }
  }

  /* 2️⃣ حلقات نابضة */
  .pulse-ring {
    position: absolute;
    top: 50%; left: 50%;
    width: 320px; height: 320px;
    margin: -160px 0 0 -160px;
    border-radius: 50%;
    border: 1.5px solid rgba(64, 156, 255, 0.3);
    animation: ringExpand 6s ease-out infinite;
  }
  .pulse-ring:nth-child(3) { animation-delay: 0s; }
  .pulse-ring:nth-child(4) { animation-delay: 2s; }
  .pulse-ring:nth-child(5) { animation-delay: 4s; }

  @keyframes ringExpand {
    0%   { transform: scale(0.5); opacity: 0.8; border-color: rgba(64,156,255,0.4); }
    100% { transform: scale(2.4); opacity: 0;   border-color: rgba(64,156,255,0); }
  }

  /* ============================================================
     🃏 البطاقة
     ============================================================ */
  .card {
    position: relative;
    z-index: 1;
    background: rgba(20, 25, 48, 0.85);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(64, 156, 255, 0.25);
    border-radius: 20px;
    padding: 32px 24px 28px;
    width: 100%; max-width: 440px;
    box-shadow:
      0 20px 60px rgba(0, 0, 0, 0.5),
      0 0 40px rgba(64, 156, 255, 0.12),
      inset 0 1px 0 rgba(255, 255, 255, 0.08);
    animation: fadeIn 0.5s ease,
               cardGlow 5s ease-in-out infinite;
    overflow: hidden;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @keyframes cardGlow {
    0%, 100% {
      box-shadow:
        0 20px 60px rgba(0, 0, 0, 0.5),
        0 0 40px rgba(64, 156, 255, 0.12),
        inset 0 1px 0 rgba(255, 255, 255, 0.08);
    }
    50% {
      box-shadow:
        0 24px 70px rgba(0, 0, 0, 0.6),
        0 0 80px rgba(64, 156, 255, 0.3),
        0 0 120px rgba(64, 156, 255, 0.12),
        inset 0 1px 0 rgba(255, 255, 255, 0.12);
    }
  }

  /* ============================================================
     🧭 الخطوات
     ============================================================ */
  .step { display: none; }
  .step.active { display: block; animation: stepIn 0.4s ease; }
  @keyframes stepIn {
    from { opacity: 0; transform: translateX(-14px); }
    to   { opacity: 1; transform: translateX(0); }
  }

  .steps-indicator {
    display: flex; justify-content: center; gap: 8px;
    margin-bottom: 22px;
  }
  .steps-indicator .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: rgba(255,255,255,0.2); transition: 0.3s;
  }
  .steps-indicator .dot.active {
    background: linear-gradient(135deg, #409cff, #8a2be2);
    width: 26px; border-radius: 4px;
    box-shadow: 0 0 12px rgba(64,156,255,0.6);
  }

  /* ============================================================
     📝 نصوص ومدخلات
     ============================================================ */
  h1 {
    font-size: 22px;
    background: linear-gradient(135deg, #409cff, #8a2be2);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    text-align: center;
    margin-bottom: 22px;
    font-weight: 800;
  }

  label {
    display: block; font-size: 13px; font-weight: 700;
    color: rgba(200, 215, 255, 0.85); margin-bottom: 6px;
  }

  input {
    width: 100%; padding: 12px 14px; margin-bottom: 14px;
    border: 1.5px solid rgba(64, 156, 255, 0.25);
    border-radius: 10px;
    font-size: 15px; outline: none; transition: 0.25s;
    background: rgba(255, 255, 255, 0.04);
    color: #e8f0ff;
  }
  input::placeholder { color: rgba(200, 215, 255, 0.35); }
  input:focus {
    border-color: rgba(64, 156, 255, 0.7);
    background: rgba(64, 156, 255, 0.08);
    box-shadow: 0 0 0 3px rgba(64, 156, 255, 0.15);
  }

  .error {
    color: #ff6b6b; font-size: 12px; font-weight: 600;
    margin-top: -8px; margin-bottom: 12px; min-height: 16px;
  }

  /* ============================================================
     🔘 الأزرار
     ============================================================ */
  button.primary {
    width: 100%; padding: 14px; border: none; border-radius: 12px;
    background: linear-gradient(135deg, #409cff, #8a2be2);
    color: #fff; font-size: 15px; font-weight: 800;
    cursor: pointer; transition: 0.3s;
    box-shadow: 0 8px 24px rgba(64,156,255,0.35);
    position: relative;
    overflow: hidden;
  }
  button.primary::after {
    content: "";
    position: absolute;
    top: 0; left: -100%;
    width: 100%; height: 100%;
    background: linear-gradient(90deg,
      transparent, rgba(255,255,255,0.3), transparent);
    transition: 0.6s;
  }
  button.primary:hover::after { left: 100%; }
  button.primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 32px rgba(64,156,255,0.5);
  }

  /* ============================================================
     📲 الخطوة 2 — التثبيت
     ============================================================ */
  .install-icon {
    width: 96px; height: 96px;
    border-radius: 24px;
    margin: 0 auto 18px;
    background: linear-gradient(135deg, #409cff, #8a2be2);
    display: flex; align-items: center; justify-content: center;
    font-size: 46px; color: #fff;
    box-shadow: 0 10px 30px rgba(64,156,255,0.4);
    animation: iconFloat 3s ease-in-out infinite;
  }

  @keyframes iconFloat {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-6px); }
  }

  .install-subtitle {
    font-size: 14px; color: rgba(200, 215, 255, 0.7);
    line-height: 1.7; margin-bottom: 22px; text-align: center;
  }

  .install-btn {
    width: 100%; padding: 15px; border: none; border-radius: 12px;
    background: linear-gradient(135deg, #409cff, #8a2be2);
    color: #fff; font-size: 16px; font-weight: 800;
    cursor: pointer; transition: 0.3s;
    box-shadow: 0 8px 24px rgba(64,156,255,0.35);
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .install-btn:hover:not(:disabled) {
    transform: translateY(-2px);
    box-shadow: 0 12px 32px rgba(64,156,255,0.5);
  }
  .install-btn:disabled { opacity: 0.5; cursor: not-allowed; box-shadow: none; }

  .skip-btn {
    display: block; width: 100%; margin-top: 12px;
    padding: 12px; background: transparent;
    border: 1.5px solid rgba(64, 156, 255, 0.3);
    border-radius: 12px;
    color: rgba(200, 215, 255, 0.8); font-size: 14px; font-weight: 700;
    cursor: pointer; transition: 0.25s;
  }
  .skip-btn:hover {
    background: rgba(64, 156, 255, 0.1);
    border-color: rgba(64, 156, 255, 0.7);
    color: #fff;
  }

  .hint {
    margin-top: 16px; font-size: 12px;
    color: rgba(200, 215, 255, 0.7);
    line-height: 1.7; padding: 12px;
    background: rgba(64, 156, 255, 0.08);
    border-radius: 10px; text-align: right;
    border-right: 3px solid #409cff;
  }

  .success-msg {
    color: #4ade80; font-size: 13px; font-weight: 700;
    margin-top: 10px; min-height: 18px; text-align: center;
  }

  /* ============================================================
     📱 استجابة
     ============================================================ */
  @media (max-width: 480px) {
    .glow-orb { width: 360px; height: 360px; margin: -180px 0 0 -180px; filter: blur(50px); }
    .glow-orb.orb-2 { width: 260px; height: 260px; margin: -130px 0 0 -130px; }
    .pulse-ring { width: 240px; height: 240px; margin: -120px 0 0 -120px; }
    .card { padding: 28px 20px 24px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .glow-orb, .pulse-ring, .card, .install-icon {
      animation: none !important;
    }
  }
</style>
</head>
<body>

<!-- 🌟 تأثيرات خلف البطاقة -->
<div class="card-effects" aria-hidden="true">
  <div class="glow-orb"></div>
  <div class="glow-orb orb-2"></div>
  <div class="pulse-ring"></div>
  <div class="pulse-ring"></div>
  <div class="pulse-ring"></div>
</div>

<!-- 🃏 البطاقة -->
<div class="card">

  <div class="steps-indicator">
    <div class="dot active" id="dot1"></div>
    <div class="dot" id="dot2"></div>
  </div>

  <!-- الخطوة 1 — التسجيل -->
  <div class="step active" id="step1">
    <h1>👋 مرحباً بك في حديث</h1>

    <label for="username">اسم المستخدم</label>
    <input type="text" id="username" placeholder="اكتب اسمك" maxlength="20">

    <label for="age">العمر</label>
    <input type="number" id="age" placeholder="مثال: 12" min="5" max="99">

    <div class="error" id="errorMsg"></div>

    <button class="primary" id="nextBtn">متابعة ←</button>
  </div>

  <!-- الخطوة 2 — التثبيت -->
  <div class="step" id="step2">
    <div class="install-icon">💬</div>

    <h1 style="margin-bottom:10px;">ثبّت تطبيق حديث</h1>
    <p class="install-subtitle">
      أضف تطبيق <strong>حديث</strong> إلى الشاشة الرئيسية للوصول السريع في أي وقت،
      وتجربة استخدام كاملة بدون متصفح.
    </p>

    <button class="install-btn" id="installBtn" disabled>
      ⬇️ إضافة حديث إلى الشاشة الرئيسية
    </button>

    <button class="skip-btn" id="skipBtn">تخطي الآن ←</button>

    <div class="success-msg" id="successMsg"></div>

    <div class="hint" id="hintBox" style="display:none;"></div>
  </div>

</div>

<script>
/* ============================================================
   🚀 تسجيل Service Worker
   ============================================================ */
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("service-worker.js")
      .then(() => console.log("✅ SW مسجل — تطبيق حديث"))
      .catch(err => console.warn("⚠️ SW:", err));
  });
}

/* ============================================================
   🧭 التنقل بين الخطوتين
   ============================================================ */
const step1El = document.getElementById("step1");
const step2El = document.getElementById("step2");
const dot1    = document.getElementById("dot1");
const dot2    = document.getElementById("dot2");

function goToStep2() {
  step1El.classList.remove("active");
  step2El.classList.add("active");
  dot1.classList.remove("active");
  dot2.classList.add("active");
  window.scrollTo({ top: 0, behavior: "smooth" });
}

/* ============================================================
   📝 الخطوة 1 — نموذج التسجيل
   ============================================================ */
document.getElementById("nextBtn").onclick = () => {
  const username = document.getElementById("username").value.trim();
  const age      = document.getElementById("age").value.trim();
  const errorEl  = document.getElementById("errorMsg");

  errorEl.textContent = "";

  if (!username) {
    errorEl.textContent = "❌ اكتب اسم المستخدم";
    return;
  }
  if (username.length < 2) {
    errorEl.textContent = "❌ الاسم قصير جداً (حرفان على الأقل)";
    return;
  }
  if (!age || isNaN(age) || age < 5 || age > 99) {
    errorEl.textContent = "❌ العمر غير صحيح (بين 5 و 99)";
    return;
  }

  localStorage.setItem("player_name", username);
  localStorage.setItem("player_age", age);

  goToStep2();
};

document.getElementById("username").addEventListener("keydown", (e) => {
  if (e.key === "Enter") document.getElementById("age").focus();
});
document.getElementById("age").addEventListener("keydown", (e) => {
  if (e.key === "Enter") document.getElementById("nextBtn").click();
});

/* ============================================================
   📲 نظام تثبيت التطبيق (PWA Install)
   يدعم: Chrome, Edge, Samsung Internet, Opera (Android + Desktop)
        + تعليمات يدوية لـ Safari (iOS) و Firefox
   ============================================================ */
(function setupInstall() {
  const installBtn = document.getElementById("installBtn");
  const hintBox    = document.getElementById("hintBox");
  const successMsg = document.getElementById("successMsg");
  const skipBtn    = document.getElementById("skipBtn");

  let deferredPrompt = null;

  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
  const isStandalone = window.matchMedia("(display-mode: standalone)").matches
                     || window.navigator.standalone === true;

  // ✅ التطبيق مثبت مسبقاً
  if (isStandalone) {
    if (successMsg) successMsg.textContent = "✅ تطبيق حديث مثبت ويعمل الآن";
    if (installBtn) {
      installBtn.disabled = true;
      installBtn.textContent = "✅ حديث مثبت";
    }
    if (skipBtn) {
      skipBtn.onclick = () => { window.location.href = "profile.html"; };
    }
    return;
  }

  // 🍎 Safari على iOS → تعليمات يدوية
  if (isIOS) {
    if (installBtn) {
      installBtn.disabled = false;
      installBtn.textContent = "📲 طريقة التثبيت على iPhone";
      installBtn.onclick = () => {
        if (hintBox) {
          hintBox.style.display = "block";
          hintBox.innerHTML = `
            💡 <strong>للتثبيت على iPhone / iPad:</strong><br>
            1. اضغط زر المشاركة <strong>⎋</strong> في أسفل Safari<br>
            2. اختر <strong>"إضافة إلى الشاشة الرئيسية"</strong><br>
            3. اضغط "إضافة"
          `;
        }
      };
    }
    if (skipBtn) {
      skipBtn.onclick = () => { window.location.href = "profile.html"; };
    }
    return;
  }

  // 🌐 التقاط حدث beforeinstallprompt
  window.addEventListener("beforeinstallprompt", (e) => {
    e.preventDefault();
    deferredPrompt = e;
    if (installBtn) {
      installBtn.disabled = false;
      installBtn.textContent = "⬇️ إضافة حديث إلى الشاشة الرئيسية";
    }
    console.log("✅ التثبيت متاح");
  });

  // 🎉 عند نجاح التثبيت
  window.addEventListener("appinstalled", () => {
    deferredPrompt = null;
    if (successMsg) successMsg.textContent = "✅ تم تثبيت حديث بنجاح!";
    if (installBtn) {
      installBtn.disabled = true;
      installBtn.textContent = "✅ حديث مثبت";
    }
    setTimeout(() => {
      window.location.href = "profile.html";
    }, 1200);
  });

  // 🖱️ ضغط زر التثبيت
  if (installBtn) {
    installBtn.onclick = async () => {
      if (!deferredPrompt) {
        if (hintBox) {
          hintBox.style.display = "block";
          hintBox.innerHTML = `
            💡 <strong>للتثبيت يدوياً:</strong><br>
            • <strong>Chrome / Edge (كمبيوتر):</strong> اضغط أيقونة ⊕ في شريط العنوان<br>
            • <strong>Chrome (أندرويد):</strong> القائمة (⋮) ← "تثبيت التطبيق"<br>
            • <strong>Firefox:</strong> لا يدعم التثبيت حالياً
          `;
        }
        return;
      }

      deferredPrompt.prompt();
      const { outcome } = await deferredPrompt.userChoice;

      if (outcome === "accepted") {
        if (successMsg) successMsg.textContent = "✅ شكراً! جاري التثبيت...";
      } else {
        if (successMsg) {
          successMsg.textContent = "⏭️ يمكنك التثبيت لاحقاً";
          successMsg.style.color = "#888";
        }
      }

      deferredPrompt = null;
      installBtn.disabled = true;
      installBtn.textContent = "✅ تم";
    };
  }

  // ⏭️ تخطي
  if (skipBtn) {
    skipBtn.onclick = () => {
      window.location.href = "index.html";
    };
  }
})();

/* ============================================================
   🖱️ تفاعل الهالات مع المؤشر
   ============================================================ */
const orb1 = document.querySelector(".glow-orb");
const orb2 = document.querySelector(".glow-orb.orb-2");

document.addEventListener("mousemove", (e) => {
  const cx = window.innerWidth / 2;
  const cy = window.innerHeight / 2;
  const dx = (e.clientX - cx) / cx;
  const dy = (e.clientY - cy) / cy;

  if (orb1) orb1.style.transform = `translate(${dx * 40}px, ${dy * 40}px)`;
  if (orb2) orb2.style.transform = `translate(${dx * -60}px, ${dy * -60}px)`;
});

document.addEventListener("touchmove", (e) => {
  if (!e.touches[0]) return;
  const t = e.touches[0];
  const cx = window.innerWidth / 2;
  const cy = window.innerHeight / 2;
  const dx = (t.clientX - cx) / cx;
  const dy = (t.clientY - cy) / cy;

  if (orb1) orb1.style.transform = `translate(${dx * 30}px, ${dy * 30}px)`;
  if (orb2) orb2.style.transform = `translate(${dx * -45}px, ${dy * -45}px)`;
}, { passive: true });
</script>

</body>
</html>
